version = "1.30.0"
php-version = "8.5"

[source]
paths = ["src", "tests"]
includes = ["vendor/symfony", "vendor/psr", "vendor/pestphp", "vendor/phpunit", "vendor/doctrine"]
excludes = ["var"]

[formatter]
print-width = 120
tab-width = 4
use-tabs = false
single-quote = true
trailing-comma = true

[linter]
integrations = ["symfony"]

[analyzer]
minimum-fail-level = "error"
# Pest's runtime DSL ($this binding, expect() chains) is opaque to static analysis;
# tests are still linted and formatted, just not type-analyzed (mirrors phpstan's src-only scope).
excludes = ["tests"]
