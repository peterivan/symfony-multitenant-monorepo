# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.tenant_base_domain: '%env(APP_TENANT_BASE_DOMAIN)%'
    # Tenant migration pipeline (ADR-001): dedicated directory, namespace, and
    # version table, kept separate from the central migration pipeline.
    app.tenant_migrations_namespace: 'App\Migrations\Tenant'
    app.tenant_migrations_dir: '%kernel.project_dir%/migrations/tenant'
    app.tenant_migrations_table: 'tenant_migration_versions'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $tenantBaseDomain: '%app.tenant_base_domain%'
            string $tenantMigrationsNamespace: '%app.tenant_migrations_namespace%'
            string $tenantMigrationsDir: '%app.tenant_migrations_dir%'
            string $tenantMetadataTable: '%app.tenant_migrations_table%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Tenant\TenantContext:
        tags:
            - { name: kernel.reset, method: reset }

    # Tenancy routing layer (ADR-001): release tenant Doctrine resources on worker
    # reuse between requests, mirroring TenantContext.
    App\Tenant\Connection\TenantEntityManagerProvider:
        tags:
            - { name: kernel.reset, method: reset }

    # Tenancy ports → their default implementations.
    App\Tenant\Registry\TenantRegistry: '@App\Tenant\Registry\DoctrineTenantRegistry'
    App\Tenant\Connection\TenantConnectionFactory: '@App\Tenant\Connection\DoctrineTenantConnectionFactory'
    App\Tenant\Credentials\TenantCredentialsResolver: '@App\Tenant\Credentials\EnvTenantCredentialsResolver'

    # Tenant migration pipeline port → its Doctrine implementation.
    App\Tenant\Migration\TenantSchemaMigrator: '@App\Tenant\Migration\DoctrineTenantSchemaMigrator'

    # Back Office ports (ADR-002).
    # Platform-operator authorization: deny-by-default until authentication (ADR-007)
    # supplies a real operator authenticator. Fail closed.
    App\BackOffice\Security\PlatformOperatorAuthorizer: '@App\BackOffice\Security\DenyByDefaultPlatformOperatorAuthorizer'
    # Audit is written to the central database via the default (central) manager.
    App\BackOffice\Audit\PlatformOperationAuditor: '@App\BackOffice\Audit\DoctrinePlatformOperationAuditor'

    # The bundle's (central) migrations DependencyFactory, for the central command.
    Doctrine\Migrations\DependencyFactory: '@doctrine.migrations.dependency_factory'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
